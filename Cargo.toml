[package]
name = "IdentiyWallet"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
bip32 = { version = "0.6.0", features = ["alloc"] }
bip39 = { version = "3.0.0", features = ["rand"] }
chacha20poly1305 = "0.11.0"
rand = { version = "0.10.3", features = ["std", "thread_rng"] }
serde_json = "1"
ssi = { version = "0.16.0", features = ["secp256k1"] }
ssi-dids = "0.5.0"
ssi-dids-core = "0.3.1"
ssi-jwk = "0.4.0"
ssi-jws = "0.5.0"
iref = "3"
thiserror = "2"
clap = { version = "4.6.8", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
